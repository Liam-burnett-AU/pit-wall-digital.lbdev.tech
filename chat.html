<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pit Wall — AI Chat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="assets/style.css?v=3">
<style>
  html, body { height: 100%; overflow: hidden; }
  .app-shell { height: 100vh; height: 100dvh; }
  .app-main.chat-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    min-width: 0;
    overflow: hidden;
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 10px;
    column-gap: 20px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .chat-header h1 { font-size: 15px; font-weight: 700; }
  .context-indicator { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .context-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 5px var(--accent); }

  /* the min-height:0 below is what actually fixes the input bar overlap —
     without it, a flex:1 scroll child refuses to shrink below its content
     height and pushes everything after it out of the visible column */
  .chat-wrapper { flex: 1; min-height: 0; overflow-y: auto; display: flex; justify-content: center; padding: 28px 20px; }
  .chat-inner { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .empty-chat { margin: auto; text-align: center; color: var(--text-muted); max-width: 400px; }
  .empty-chat .mark {
    width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 18px;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 800; font-size: 18px;
  }
  .empty-chat h2 { font-size: 21px; color: var(--text); margin-bottom: 9px; font-weight: 700; }
  .empty-chat p { font-size: 13.5px; line-height: 1.6; }
  .suggestion-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
  .suggestion-chip {
    font-size: 12px; font-family: var(--font-mono); color: var(--text-muted);
    border: 1px solid var(--border); padding: 8px 13px; border-radius: 20px; cursor: pointer;
    background: var(--surface); transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .suggestion-chip:hover { border-color: var(--accent-border); color: var(--accent); background: var(--accent-soft); }

  .message-row { display: flex; gap: 10px; align-items: flex-end; }
  .message-row.user { justify-content: flex-end; }
  .message-row.assistant { justify-content: flex-start; }

  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 800; font-size: 11px;
  }

  .msg-col { display: flex; flex-direction: column; max-width: 74%; min-width: 0; }
  .message-row.user .msg-col { align-items: flex-end; }
  .message-row.assistant .msg-col { align-items: flex-start; }

  .bubble { padding: 12px 16px; border-radius: 14px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; box-shadow: var(--shadow-sm); }
  .bubble.user { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .bubble.assistant { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
  .bubble.assistant.error { border-color: var(--danger-border); color: var(--danger); }
  .bubble.assistant .katex { color: var(--text); font-size: 1.02em; }

  .msg-time { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); margin-top: 5px; padding: 0 4px; }

  .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .input-bar { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--surface); padding: 16px 20px; display: flex; justify-content: center; }
  .input-inner {
    width: 100%; max-width: 760px; display: flex; gap: 10px; align-items: flex-end;
    background: rgba(163, 193, 231, 0.05); border: 1px solid var(--border); border-radius: 22px;
    padding: 6px 8px 6px 18px; transition: border-color 0.15s ease;
  }
  .input-inner:focus-within { border-color: var(--accent); }
  #chatInput {
    flex: 1; resize: none; min-height: 24px; max-height: 140px;
    padding: 10px 0; background: transparent; border: none;
    color: var(--text); font-size: 14px; font-family: var(--font-body);
    outline: none; line-height: 1.4;
  }
  #chatInput::placeholder { color: var(--text-faint); }

  .send-btn {
    width: 40px; height: 40px; padding: 0; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }

  @media (max-width: 640px) {
    .chat-header { padding: 14px 18px; }
    .context-indicator span:not(.dot) { display: none; }
    .msg-col { max-width: 86%; }
  }
</style>
</head>
<body>

  <div id="toastContainer"></div>

  <div class="app-shell">
    <div id="navRoot"></div>

    <div class="app-main chat-shell">
      <div class="chat-header">
        <h1>Pit Wall // AI Chat</h1>
        <div class="flex items-center gap-16">
          <span class="context-indicator" id="contextIndicator"><span class="dot"></span><span>Loading context...</span></span>
          <button type="button" class="btn btn-outline btn-sm" id="downloadChatBtn" title="Download this conversation">Download</button>
        </div>
      </div>

      <div class="chat-wrapper">
        <div class="chat-inner" id="chatInner">
          <div class="state-block" id="fullLoading">
            <div style="max-width:500px; margin:0 auto; text-align:left;">
              <div class="skeleton skeleton-block w-40" style="margin-left:auto; width:35%;"></div>
              <div class="skeleton skeleton-card" style="height:50px; width:70%;"></div>
              <div class="skeleton skeleton-card" style="height:70px; width:60%; margin-left:auto;"></div>
            </div>
          </div>
          <div class="state-block hidden" id="fullError">
            <p id="fullErrorMsg">Couldn't load chat.</p>
            <p style="margin-top:8px;"><a href="dashboard.html">Back to dashboard</a></p>
          </div>
        </div>
      </div>

      <div class="input-bar">
        <div class="input-inner">
          <textarea id="chatInput" placeholder="Ask about strategy, your robot, or the competition..." rows="1"></textarea>
          <button type="button" class="btn btn-primary send-btn" id="sendBtn" aria-label="Send message" title="Send">➤</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Markdown + maths rendering libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig, renderNav, wireNav, callGroq, renderMarkdown } from "./assets/app.js?v=3";

    document.getElementById('navRoot').innerHTML = renderNav('chat');

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    wireNav(auth, signOut);

    let currentUid = null;
    let messages = [];
    let teamContext = null;
    let robotContext = null;
    let scoutingContext = [];
    let notebookContext = [];

    const chatInner = document.getElementById('chatInner');
    const fullLoading = document.getElementById('fullLoading');
    const fullError = document.getElementById('fullError');
    const fullErrorMsg = document.getElementById('fullErrorMsg');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const contextIndicator = document.getElementById('contextIndicator');

    function showFullError(msg) {
      fullLoading.classList.add('hidden');
      fullErrorMsg.textContent = msg;
      fullError.classList.remove('hidden');
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUid = user.uid;

      try {
        const [teamSnap, robotSnap, chatSnap, scoutingSnap, notebookSnap] = await Promise.all([
          getDoc(doc(db, 'teams', user.uid)),
          getDoc(doc(db, 'robots', user.uid)),
          getDoc(doc(db, 'chatHistory', user.uid)),
          getDocs(query(collection(db, 'scouting', user.uid, 'entries'), orderBy('createdAt', 'desc'), limit(20))),
          getDocs(query(collection(db, 'engineeringNotebook', user.uid, 'entries'), orderBy('date', 'desc'), limit(10)))
        ]);

        if (!teamSnap.exists()) {
          showFullError('No team profile found for this account.');
          return;
        }

        teamContext = teamSnap.data();
        robotContext = robotSnap.exists() ? robotSnap.data() : null;
        scoutingContext = scoutingSnap.docs.map(d => d.data()).filter(e => !e.disregarded);
        notebookContext = notebookSnap.docs.map(d => d.data());

        const contextParts = ['team'];
        if (robotContext) contextParts.push('robot profile');
        if (scoutingContext.length) contextParts.push(`${scoutingContext.length} scouted team${scoutingContext.length === 1 ? '' : 's'}`);
        if (notebookContext.length) contextParts.push(`${notebookContext.length} notebook entr${notebookContext.length === 1 ? 'y' : 'ies'}`);
        contextIndicator.innerHTML = `<span class="dot"></span><span>Context: ${contextParts.join(' + ')}</span>`;

        messages = chatSnap.exists() && Array.isArray(chatSnap.data().messages) ? chatSnap.data().messages : [];

        fullLoading.classList.add('hidden');
        renderMessages();

      } catch (err) {
        console.error(err);
        showFullError("Couldn't load your chat. Check your connection and try again.");
      }
    });

    function formatTime(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
    }

    function renderMessages() {
      chatInner.innerHTML = '';

      if (messages.length === 0) {
        chatInner.innerHTML = `
          <div class="empty-chat">
            <div class="mark">PW</div>
            <h2>Ask Pit Wall anything</h2>
            <p>Strategy for your next match, engineering advice on your robot, or general questions about the competition — all with context from your team's profile.</p>
            <div class="suggestion-row">
              <button type="button" class="suggestion-chip" data-suggestion="What should we focus on in autonomous?">What should we focus on in autonomous?</button>
              <button type="button" class="suggestion-chip" data-suggestion="How can we improve our drivetrain?">How can we improve our drivetrain?</button>
              <button type="button" class="suggestion-chip" data-suggestion="How should we play against the teams we've scouted?">How should we play against the teams we've scouted?</button>
            </div>
          </div>
        `;
        chatInner.querySelectorAll('.suggestion-chip').forEach(btn => {
          btn.addEventListener('click', () => {
            chatInput.value = btn.dataset.suggestion;
            chatInput.focus();
            autoResize();
          });
        });
        return;
      }

      messages.forEach((m) => {
        const row = document.createElement('div');
        row.className = `message-row ${m.role}`;

        if (m.role === 'assistant') {
          const avatar = document.createElement('div');
          avatar.className = 'avatar';
          avatar.textContent = 'PW';
          row.appendChild(avatar);
        }

        const col = document.createElement('div');
        col.className = 'msg-col';

        const bubble = document.createElement('div');
        bubble.className = `bubble ${m.role}`;
        if (m.role === 'assistant') {
          bubble.classList.add('md');
          bubble.innerHTML = renderMarkdown(m.content);
        } else {
          bubble.textContent = m.content;
        }
        col.appendChild(bubble);

        if (m.timestamp) {
          const time = document.createElement('div');
          time.className = 'msg-time';
          time.textContent = formatTime(m.timestamp);
          col.appendChild(time);
        }

        row.appendChild(col);
        chatInner.appendChild(row);
      });

      renderMathInBubbles();
      scrollToBottom();
    }

    document.getElementById('downloadChatBtn').addEventListener('click', () => {
      if (!messages || messages.length === 0) {
        alert('No messages to download yet.');
        return;
      }

      const teamLabel = teamContext
        ? `Team ${teamContext.teamNumber || '?'} — ${teamContext.teamName || 'Unnamed team'}`
        : 'Pit Wall';

      const header = `${teamLabel}\nPit Wall AI Chat Export\nDownloaded: ${new Date().toLocaleString('en-AU')}\n${'='.repeat(50)}\n\n`;
      const body = messages.map(m => {
        const who = m.role === 'user' ? 'You' : 'Pit Wall AI';
        const when = m.timestamp ? new Date(m.timestamp).toLocaleString('en-AU') : '';
        return `[${who}]${when ? ' — ' + when : ''}\n${m.content}\n`;
      }).join('\n');

      const blob = new Blob([header + body], { type: 'text/plain;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pit-wall-chat-${new Date().toISOString().slice(0, 10)}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    function renderMathInBubbles() {
      if (!window.renderMathInElement) return;
      document.querySelectorAll('.bubble.assistant').forEach((el) => {
        window.renderMathInElement(el, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\[', right: '\\]', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false }
          ],
          throwOnError: false
        });
      });
    }

    function scrollToBottom() {
      const wrapper = document.querySelector('.chat-wrapper');
      requestAnimationFrame(() => { wrapper.scrollTop = wrapper.scrollHeight; });
    }

    function autoResize() {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + 'px';
    }
    chatInput.addEventListener('input', autoResize);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function buildSystemPrompt() {
      const teamLine = `Team ${teamContext.teamNumber || '?'} ("${teamContext.teamName || 'Unnamed team'}"), competing in ${teamContext.competition || 'FTC'}${teamContext.season ? ' — ' + teamContext.season : ''}.`;

      const robotLine = robotContext
        ? `Their robot: drivetrain is ${robotContext.drivetrain || 'not specified'}; game piece mechanism is ${robotContext.gamePieceMechanism || 'not specified'}; autonomous routine: ${robotContext.autonomousRoutine || 'not specified'}. Additional notes: ${robotContext.notes || 'none'}.`
        : 'They have not filled in a robot profile yet, so give general advice and suggest they add robot details for more specific help.';

      let scoutingLine = 'No scouting data has been logged yet.';
      if (scoutingContext.length) {
        const entries = scoutingContext.map(e => {
          const parts = [`Team ${e.scoutedTeamNumber || '?'} (${e.scoutedTeamName || 'unnamed'})`];
          if (e.eventName) parts.push(`at ${e.eventName}`);
          if (e.drivetrainObserved) parts.push(`drivetrain: ${e.drivetrainObserved}`);
          if (e.scoringCapability) parts.push(`scoring: ${e.scoringCapability}`);
          if (e.autoObserved) parts.push(`auto: ${e.autoObserved}`);
          if (e.driverRating) parts.push(`driver skill: ${e.driverRating}/5`);
          if (e.notes) parts.push(`notes: ${e.notes}`);
          return '- ' + parts.join('; ');
        }).join('\n');
        scoutingLine = `Scouted opponent teams (most recent ${scoutingContext.length}):\n${entries}`;
      }

      let notebookLine = 'No engineering notebook entries logged yet.';
      if (notebookContext.length) {
        const entries = notebookContext.map(e =>
          `- ${e.date}: "${e.title}" — ${e.task}${e.reflection ? ' | Reflection: ' + e.reflection : ''}`
        ).join('\n');
        notebookLine = `Recent engineering notebook entries (most recent ${notebookContext.length}):\n${entries}`;
      }

      return `You are Pit Wall, an AI assistant for FIRST Tech Challenge (FTC) robotics teams. You help with competition strategy, robot engineering advice, and general questions about FTC. Be practical, concise, and encouraging — you're talking to a student team, not writing a report.

${teamLine}
${robotLine}

${scoutingLine}

${notebookLine}

Only discuss FTC — FRC support is not available in this app yet. If asked about FRC, say so briefly and redirect to what you can help with.

Formatting: you may use Markdown (bold, lists, headers, code blocks) and LaTeX math notation (inline with $...$, block equations with $$...$$) — both render properly in this chat, so use them where they aid clarity (e.g. gear ratios, scoring calculations).`;
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      const userMsg = { role: 'user', content: text, timestamp: new Date().toISOString() };
      messages.push(userMsg);
      chatInput.value = '';
      autoResize();
      renderMessages();
      addLoadingBubble();

      sendBtn.disabled = true;
      chatInput.disabled = true;

      try {
        const apiMessages = [
          { role: 'system', content: buildSystemPrompt() },
          ...messages.map(m => ({ role: m.role, content: m.content }))
        ];

        const data = await callGroq(apiMessages);
        const replyText = data?.choices?.[0]?.message?.content;
        if (!replyText) throw new Error('No reply content in API response');

        removeLoadingBubble();
        messages.push({ role: 'assistant', content: replyText, timestamp: new Date().toISOString() });
        renderMessages();

        await setDoc(doc(db, 'chatHistory', currentUid), { messages, updatedAt: new Date().toISOString() });

      } catch (err) {
        console.error('Chat error:', err);
        removeLoadingBubble();
        showErrorBubble(err.message || 'Something went wrong talking to the AI.');
      } finally {
        sendBtn.disabled = false;
        chatInput.disabled = false;
        chatInput.focus();
      }
    }
    sendBtn.addEventListener('click', sendMessage);

    function addLoadingBubble() {
      const row = document.createElement('div');
      row.className = 'message-row assistant';
      row.id = 'loadingRow';
      row.innerHTML = `
        <div class="avatar">PW</div>
        <div class="msg-col">
          <div class="bubble assistant">
            <div class="typing-dots"><span></span><span></span><span></span></div>
          </div>
        </div>
      `;
      chatInner.appendChild(row);
      scrollToBottom();
    }

    function removeLoadingBubble() {
      document.getElementById('loadingRow')?.remove();
    }

    function showErrorBubble(msg) {
      const row = document.createElement('div');
      row.className = 'message-row assistant';
      row.innerHTML = '<div class="avatar">PW</div>';
      const col = document.createElement('div');
      col.className = 'msg-col';
      const bubble = document.createElement('div');
      bubble.className = 'bubble assistant error';
      bubble.textContent = `Couldn't get a reply: ${msg}. Try again in a moment.`;
      col.appendChild(bubble);
      row.appendChild(col);
      chatInner.appendChild(row);
      scrollToBottom();
    }
  </script>

</body>
</html>
