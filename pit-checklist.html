<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pit Wall — Pit Checklist</title>
<link rel="stylesheet" href="assets/style.css?v=5">
<style>
  .progress-ring-wrap { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .progress-text { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); text-align: right; }
  .progress-text .count { color: var(--accent); font-size: 18px; font-weight: 700; display: block; }

  .checklist-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 8px; margin-bottom: 22px; }
  .checklist-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .checklist-item:last-child { border-bottom: none; }
  .checklist-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .checklist-item label { flex: 1; font-size: 14.5px; cursor: pointer; transition: color 0.15s ease, text-decoration 0.15s ease; }
  .checklist-item.checked label { color: var(--text-muted); text-decoration: line-through; }

  .remove-item-btn { background: transparent; border: none; color: var(--text-faint); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; transition: color 0.15s ease; }
  .remove-item-btn:hover { color: var(--danger); }

  .add-item-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .add-item-row input {
    flex: 1; padding: 11px 13px; background: rgba(163, 193, 231, 0.06); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size: 14px; font-family: var(--font-body); outline: none;
  }
  .add-item-row input:focus { border-color: var(--accent); }

  .actions-row { display: flex; justify-content: flex-end; }
</style>
</head>
<body>

  <div id="toastContainer" aria-live="polite" aria-atomic="false"></div>

  <div class="app-shell">
    <div id="navRoot"></div>

    <div class="app-main">
      <main class="page narrow" id="mainContent" tabindex="-1">
        <div class="state-block" id="loadingState">
          <div style="max-width:420px; margin:0 auto; text-align:left;">
            <div class="skeleton skeleton-block w-40"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-block w-80"></div>
          </div>
        </div>

        <div class="state-block hidden" id="errorState">
          <p id="errorMessage">Something went wrong.</p>
          <p style="margin-top:10px;"><a href="dashboard.html">Back to dashboard</a></p>
        </div>

        <div id="pageContent" class="hidden">
          <div class="page-head">
            <div>
              <h1>Pit Checklist</h1>
              <p>Run through this before you head to competition. Check items off, add your own, or reset before the next event.</p>
            </div>
            <div class="progress-ring-wrap">
              <div class="progress-text"><span class="count" id="progressCount">0/0</span>done</div>
            </div>
          </div>

          <div class="add-item-row">
            <input type="text" id="newItemInput" aria-label="New checklist item" placeholder="Add a checklist item...">
            <button type="button" class="btn btn-primary" id="addItemBtn">Add</button>
          </div>

          <div class="checklist-card" id="checklistCard"></div>

          <div class="actions-row">
            <button type="button" class="btn btn-outline" id="resetBtn">Uncheck All (New Competition)</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig, escapeHtml, toast, renderNav, wireNav, setTeamChip } from "./assets/app.js?v=5";

    document.getElementById('navRoot').innerHTML = renderNav('checklist');

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    wireNav(auth, signOut);

    let currentUid = null;
    let items = [];

    const DEFAULT_ITEMS = [
      { id: 'item_battery', text: 'Battery charged (and spare packed)', checked: false },
      { id: 'item_weighed', text: 'Robot weighed and inspected', checked: false },
      { id: 'item_controller', text: 'Driver station / controller charged & paired', checked: false },
      { id: 'item_tools', text: 'Toolkit packed (spare screws, zip ties, tape)', checked: false },
      { id: 'item_spare_parts', text: 'Spare parts packed (motors, servos, wheels)', checked: false },
      { id: 'item_laptop', text: 'Laptop charged with code backed up', checked: false },
      { id: 'item_practice', text: 'Practiced autonomous & driver period', checked: false },
      { id: 'item_pit_sign', text: 'Pit sign / banner packed', checked: false }
    ];

    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const errorMessage = document.getElementById('errorMessage');
    const pageContent = document.getElementById('pageContent');
    const checklistCard = document.getElementById('checklistCard');

    function showError(msg) {
      loadingState.classList.add('hidden');
      pageContent.classList.add('hidden');
      errorMessage.textContent = msg;
      errorState.classList.remove('hidden');
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUid = user.uid;

      try {
        const teamSnap = await getDoc(doc(db, 'teams', user.uid));
        if (!teamSnap.exists()) {
          showError('No team profile found for this account.');
          return;
        }
        setTeamChip(teamSnap.data());

        const checklistSnap = await getDoc(doc(db, 'pitChecklist', user.uid));
        items = (checklistSnap.exists() && Array.isArray(checklistSnap.data().items))
          ? checklistSnap.data().items
          : DEFAULT_ITEMS;

        loadingState.classList.add('hidden');
        pageContent.classList.remove('hidden');
        renderChecklist();

      } catch (err) {
        console.error(err);
        showError("Couldn't load your checklist. Check your connection and try again.");
      }
    });

    function renderChecklist() {
      checklistCard.innerHTML = '';

      items.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'checklist-item' + (item.checked ? ' checked' : '');
        row.innerHTML = `
          <input type="checkbox" id="chk_${item.id}" ${item.checked ? 'checked' : ''}>
          <label for="chk_${item.id}">${escapeHtml(item.text)}</label>
          <button type="button" class="remove-item-btn" title="Remove item" aria-label="Remove &quot;${escapeHtml(item.text)}&quot;">✕</button>
        `;
        row.querySelector('input').addEventListener('change', (e) => toggleItem(item.id, e.target.checked));
        row.querySelector('.remove-item-btn').addEventListener('click', () => removeItem(item.id));
        checklistCard.appendChild(row);
      });

      const doneCount = items.filter(i => i.checked).length;
      document.getElementById('progressCount').textContent = `${doneCount}/${items.length}`;
    }

    async function persist() {
      try {
        await setDoc(doc(db, 'pitChecklist', currentUid), { items, updatedAt: new Date().toISOString() });
      } catch (err) {
        console.error(err);
        toast("Couldn't save checklist changes.", 'error');
      }
    }

    function toggleItem(id, checked) {
      const item = items.find(i => i.id === id);
      if (item) item.checked = checked;
      renderChecklist();
      persist();
    }

    document.getElementById('addItemBtn').addEventListener('click', addItem);
    document.getElementById('newItemInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addItem();
    });

    function addItem() {
      const input = document.getElementById('newItemInput');
      const text = input.value.trim();
      if (!text) return;

      items.push({ id: 'item_' + Date.now(), text, checked: false });
      input.value = '';
      renderChecklist();
      persist();
      toast('Item added.', 'success');
    }

    function removeItem(id) {
      items = items.filter(i => i.id !== id);
      renderChecklist();
      persist();
      toast('Item removed.', 'success');
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('Uncheck every item? Good to do before a new competition day.')) return;
      items.forEach(i => i.checked = false);
      renderChecklist();
      persist();
      toast('Checklist reset for a new competition.', 'success');
    });
  </script>

</body>
</html>
