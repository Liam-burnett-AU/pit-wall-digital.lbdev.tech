<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pit Wall — Schedule</title>
<link rel="stylesheet" href="assets/style.css?v=4">
<style>
  .event-select-card { margin-bottom: 24px; }
  .event-select-card .level-toggle { margin-top: 14px; }

  .match-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 16px 18px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .match-card.our-match { border-color: var(--accent-border); background: var(--accent-soft); }
  .match-num { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); min-width: 70px; }
  .match-time { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); min-width: 90px; }
  .alliance-block { display: flex; gap: 18px; flex: 1; flex-wrap: wrap; }
  .alliance { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .alliance-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 4px; }
  .alliance-label.red { background: rgba(255,90,90,0.15); color: #ff8f8f; }
  .alliance-label.blue { background: rgba(90,150,255,0.15); color: #8fbaff; }
  .team-tag { font-family: var(--font-mono); }
  .team-tag.mine { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

  <div id="toastContainer" aria-live="polite" aria-atomic="false"></div>

  <div class="app-shell">
    <div id="navRoot"></div>

    <div class="app-main">
      <main class="page" id="mainContent" tabindex="-1">
        <div class="state-block" id="loadingState">
          <div style="max-width:420px; margin:0 auto; text-align:left;">
            <div class="skeleton skeleton-block w-40"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
          </div>
        </div>

        <div class="state-block hidden" id="errorState">
          <p id="errorMessage">Something went wrong.</p>
          <p style="margin-top:10px;"><a href="dashboard.html">Back to dashboard</a></p>
        </div>

        <div id="pageContent" class="hidden">
          <div class="page-head">
            <div>
              <h1>Match Schedule</h1>
              <p>Pulled from FIRST's official FTC Events API for your team. Looking for past results and performance analysis instead? Head to <a href="events.html">Events</a>.</p>
            </div>
          </div>

          <div class="event-select-card card">
            <div class="field" style="margin-bottom:0;">
              <label for="eventSelect">Your registered events</label>
              <select id="eventSelect"></select>
            </div>
            <div class="level-toggle">
              <button type="button" class="level-btn active" id="levelQual">Qualification</button>
              <button type="button" class="level-btn" id="levelPlayoff">Playoff</button>
            </div>
          </div>

          <div id="matchList"></div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig, escapeHtml, renderNav, wireNav, setTeamChip, ftcEventsFetch, FTC_EVENTS_SEASON } from "./assets/app.js?v=4";

    document.getElementById('navRoot').innerHTML = renderNav('schedule');

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    wireNav(auth, signOut);

    let teamNumber = null;
    let currentEventCode = null;
    let currentLevel = 'qual';

    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const errorMessage = document.getElementById('errorMessage');
    const pageContent = document.getElementById('pageContent');
    const matchList = document.getElementById('matchList');

    function showError(msg) {
      loadingState.classList.add('hidden');
      pageContent.classList.add('hidden');
      errorMessage.textContent = msg;
      errorState.classList.remove('hidden');
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const teamSnap = await getDoc(doc(db, 'teams', user.uid));
        if (!teamSnap.exists()) {
          showError('No team profile found for this account.');
          return;
        }
        const team = teamSnap.data();
        teamNumber = team.teamNumber;
        setTeamChip(team);

        if (!teamNumber) {
          showError('No team number set — add it in Settings first.');
          return;
        }

        await loadEvents();

      } catch (err) {
        console.error(err);
        showError("Couldn't load your team data. Check your connection and try again.");
      }
    });

    async function loadEvents() {
      try {
        const data = await ftcEventsFetch(`/${FTC_EVENTS_SEASON}/events?teamNumber=${teamNumber}`);
        const events = data.events || [];

        loadingState.classList.add('hidden');
        pageContent.classList.remove('hidden');

        const select = document.getElementById('eventSelect');
        if (events.length === 0) {
          select.innerHTML = '<option value="">No registered events found for this team</option>';
          matchList.innerHTML = '<div class="entries-empty">No events found for your team this season yet.</div>';
          return;
        }

        select.innerHTML = events.map(e =>
          `<option value="${e.code}">${escapeHtml(e.name)} (${e.dateStart?.slice(0, 10) || ''})</option>`
        ).join('');

        currentEventCode = events[0].code;
        await loadSchedule();

      } catch (err) {
        console.error(err);
        loadingState.classList.add('hidden');
        pageContent.classList.remove('hidden');
        matchList.innerHTML = `<div class="entries-empty">Couldn't load events — check your FTC Events API credentials and connection.<br>(${escapeHtml(err.message)})</div>`;
      }
    }

    document.getElementById('eventSelect').addEventListener('change', (e) => {
      currentEventCode = e.target.value;
      loadSchedule();
    });

    function setLevel(level) {
      currentLevel = level;
      document.getElementById('levelQual').classList.toggle('active', level === 'qual');
      document.getElementById('levelPlayoff').classList.toggle('active', level === 'playoff');
      loadSchedule();
    }
    document.getElementById('levelQual').addEventListener('click', () => setLevel('qual'));
    document.getElementById('levelPlayoff').addEventListener('click', () => setLevel('playoff'));

    async function loadSchedule() {
      if (!currentEventCode) return;
      matchList.innerHTML = `
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>`;

      try {
        const data = await ftcEventsFetch(`/${FTC_EVENTS_SEASON}/schedule/${currentEventCode}?tournamentLevel=${currentLevel}&teamNumber=${teamNumber}`);
        const matches = data.schedule || [];

        if (matches.length === 0) {
          matchList.innerHTML = `<div class="entries-empty">No ${currentLevel} matches published for this event yet.</div>`;
          return;
        }

        matchList.innerHTML = matches.map(renderMatch).join('');

      } catch (err) {
        console.error(err);
        matchList.innerHTML = `<div class="entries-empty">Couldn't load the schedule — check your connection.<br>(${escapeHtml(err.message)})</div>`;
      }
    }

    function renderMatch(m) {
      const teams = m.teams || [];
      const red = teams.filter(t => (t.station || '').toLowerCase().includes('red'));
      const blue = teams.filter(t => (t.station || '').toLowerCase().includes('blue'));
      const isOurMatch = teams.some(t => String(t.teamNumber) === String(teamNumber));
      const timeStr = m.startTime ? new Date(m.startTime).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' }) : 'TBD';

      const teamTag = (t) => {
        const mine = String(t.teamNumber) === String(teamNumber);
        return `<span class="team-tag${mine ? ' mine' : ''}">#${t.teamNumber}</span>`;
      };

      return `
        <div class="match-card${isOurMatch ? ' our-match' : ''}">
          <span class="match-num">Match ${m.matchNumber ?? '?'}</span>
          <span class="match-time">${timeStr}</span>
          <div class="alliance-block">
            <div class="alliance"><span class="alliance-label red">Red</span> ${red.map(teamTag).join(' ')}</div>
            <div class="alliance"><span class="alliance-label blue">Blue</span> ${blue.map(teamTag).join(' ')}</div>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
