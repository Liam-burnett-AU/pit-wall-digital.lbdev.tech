<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem('pitwall-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>Pit Wall — Robot Profile</title>
<link rel="stylesheet" href="assets/style.css?v=7">
<style>
  form { display: flex; flex-direction: column; gap: 22px; }
  .actions { display: flex; align-items: center; gap: 16px; margin-top: 4px; }
  .last-updated { margin-top: 6px; font-size: 12px; color: var(--text-faint); font-family: var(--font-mono); }
</style>
</head>
<body>

  <div id="toastContainer" aria-live="polite" aria-atomic="false"></div>

  <div class="app-shell">
    <div id="navRoot"></div>

    <div class="app-main">
      <main class="page narrow" id="mainContent" tabindex="-1">
        <div class="state-block" id="loadingState">
          <div style="max-width:420px; margin:0 auto; text-align:left;">
            <div class="skeleton skeleton-block w-40"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-block w-80"></div>
            <div class="skeleton skeleton-block w-60"></div>
          </div>
        </div>

        <div class="state-block hidden" id="errorState">
          <p id="errorMessage">Something went wrong.</p>
          <p style="margin-top:10px;"><a href="dashboard.html">Back to dashboard</a></p>
        </div>

        <div id="formContent" class="hidden">
          <div class="page-head">
            <div>
              <h1>Your Robot</h1>
              <p>This info feeds directly into the AI chat and event analysis — the more detail here, the more specific the advice can be.</p>
            </div>
          </div>

          <form class="card" id="robotForm" onsubmit="return false;">
            <div class="field">
              <label for="drivetrain">Drivetrain</label>
              <input type="text" id="drivetrain" placeholder="e.g. Mecanum, tank, swerve...">
            </div>

            <div class="field">
              <label for="gamePieceMechanism">Game piece mechanism</label>
              <textarea id="gamePieceMechanism" placeholder="Describe how your robot picks up, holds, and scores game pieces..."></textarea>
            </div>

            <div class="field">
              <label for="autonomousRoutine">Autonomous routine</label>
              <textarea id="autonomousRoutine" placeholder="What does your robot do during the autonomous period?"></textarea>
            </div>

            <div class="field">
              <label for="notes">Additional notes</label>
              <textarea id="notes" placeholder="Anything else worth knowing — known issues, upcoming changes, strategy notes..."></textarea>
              <div class="hint">Optional — free text, the AI will use this for extra context.</div>
            </div>

            <div class="actions">
              <button type="button" class="btn btn-primary" id="saveBtn">Save Profile</button>
              <span class="status-msg" id="saveStatus"></span>
            </div>
            <div class="last-updated hidden" id="lastUpdated"></div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig, toast, renderNav, wireNav, setTeamChip, resolveTeamId } from "./assets/app.js?v=7";

    document.getElementById('navRoot').innerHTML = renderNav('robot');

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    wireNav(auth, signOut);

    let currentTeamId = null;

    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const errorMessage = document.getElementById('errorMessage');
    const formContent = document.getElementById('formContent');
    const saveBtn = document.getElementById('saveBtn');
    const saveStatus = document.getElementById('saveStatus');
    const lastUpdated = document.getElementById('lastUpdated');

    function showError(msg) {
      loadingState.classList.add('hidden');
      formContent.classList.add('hidden');
      errorMessage.textContent = msg;
      errorState.classList.remove('hidden');
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      try {
        currentTeamId = await resolveTeamId(db, user);
        const teamSnap = await getDoc(doc(db, 'teams', currentTeamId));
        if (!teamSnap.exists()) {
          showError('No team profile found for this account.');
          return;
        }
        setTeamChip(teamSnap.data());

        const robotSnap = await getDoc(doc(db, 'robots', currentTeamId));
        if (robotSnap.exists()) {
          const robot = robotSnap.data();
          document.getElementById('drivetrain').value = robot.drivetrain || '';
          document.getElementById('gamePieceMechanism').value = robot.gamePieceMechanism || '';
          document.getElementById('autonomousRoutine').value = robot.autonomousRoutine || '';
          document.getElementById('notes').value = robot.notes || '';

          if (robot.updatedAt) showLastUpdated(robot.updatedAt);
        }

        loadingState.classList.add('hidden');
        formContent.classList.remove('hidden');

      } catch (err) {
        console.error(err);
        showError("Couldn't load your robot profile. Check your connection and try again.");
      }
    });

    function showLastUpdated(iso) {
      const d = new Date(iso);
      lastUpdated.textContent = `Last updated: ${d.toLocaleDateString('en-AU')} ${d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' })}`;
      lastUpdated.classList.remove('hidden');
    }

    saveBtn.addEventListener('click', async () => {
      const drivetrain = document.getElementById('drivetrain').value.trim();
      const gamePieceMechanism = document.getElementById('gamePieceMechanism').value.trim();
      const autonomousRoutine = document.getElementById('autonomousRoutine').value.trim();
      const notes = document.getElementById('notes').value.trim();

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      saveStatus.className = 'status-msg';
      saveStatus.textContent = '';

      try {
        const updatedAt = new Date().toISOString();
        await setDoc(doc(db, 'robots', currentTeamId), { drivetrain, gamePieceMechanism, autonomousRoutine, notes, updatedAt });

        saveStatus.textContent = 'Saved.';
        saveStatus.className = 'status-msg success';
        toast('Robot profile saved.', 'success');
        showLastUpdated(updatedAt);

      } catch (err) {
        console.error('Save error:', err);
        saveStatus.textContent = "Couldn't save — check your connection and try again.";
        saveStatus.className = 'status-msg error';
        toast("Couldn't save robot profile.", 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Profile';
      }
    });
  </script>

</body>
</html>
